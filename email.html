<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Account Setup - iOS Style</title>
  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --accent-blue: #007aff;
      --accent-green: #34c759;
      --accent-red: #ff3b30;
      --text-main: #000000;
      --text-muted: #8e8e93;
      --border-color: #c6c6c8;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
      opacity: 0;
      z-index: 9999;
    }

    #toast.show {
      top: 14px;
      opacity: 1;
    }

    #toast .toast-icon {
      background: var(--accent-green);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Top Nav / Title */
    .header-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: -0.4px;
    }

    /* Main Container Card */
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Step Card */
    .step-card {
      display: none;
      flex-direction: column;
      gap: 16px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .step-card.active {
      display: flex;
    }

    .info-box-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .box-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.3px;
      padding-left: 4px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    /* Compact Input/Box */
    .ios-box {
      width: 100%;
      padding: 10px 44px 10px 12px;
      background: #fafafa;
      border-radius: 10px;
      font-size: 14.5px;
      font-family: monospace, var(--font-family);
      color: var(--text-main);
      outline: none;
      transition: all 0.3s ease;
      user-select: text;
      -webkit-user-select: text;
    }

    /* Dynamic Validation States */
    .ios-box.valid {
      border: 1.5px solid var(--accent-green);
      box-shadow: 0 0 10px rgba(52, 199, 89, 0.25), 0 2px 6px rgba(52, 199, 89, 0.15);
    }

    .ios-box.invalid {
      border: 1.5px solid var(--accent-red);
      box-shadow: 0 0 10px rgba(255, 59, 48, 0.25), 0 2px 6px rgba(255, 59, 48, 0.15);
    }

    /* Copy Button inside Box */
    .box-copy-btn {
      position: absolute;
      right: 8px;
      width: 26px;
      height: 26px;
      background: #f0f0f5;
      color: var(--accent-blue);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .box-copy-btn.copied {
      background: var(--accent-green) !important;
      color: #ffffff !important;
    }

    /* Proceed / Action Button */
    .btn-proceed {
      width: 100%;
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
      transition: opacity 0.2s ease;
    }

    .btn-proceed:active {
      opacity: 0.8;
    }

    /* iOS Spinner Animation */
    .ios-spinner {
      display: none;
      width: 20px;
      height: 20px;
      animation: iosRotate 0.8s steps(8, end) infinite;
    }

    @keyframes iosRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body onload="initGenerator()">

  <!-- Toast Notification -->
  <div id="toast">
    <div class="toast-icon">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <span>Copied Successfully!</span>
  </div>

  <h1 class="header-title">Account Registration</h1>

  <div class="container">
    
    <!-- STEP 1: Email -->
    <div class="step-card active" id="step-1">
      <div class="info-box-group">
        <label class="box-label">Email Address</label>
        <div class="input-wrapper">
          <input type="text" id="email-box" class="ios-box valid" readonly>
          <button class="box-copy-btn" onclick="copyValue('email-box', this)" title="Copy">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>
      </div>
      <button class="btn-proceed" onclick="proceedStep(2)">
        <span>Proceed</span>
      </button>
    </div>

    <!-- STEP 2: Password -->
    <div class="step-card" id="step-2">
      <div class="info-box-group">
        <label class="box-label">Password (10-12 Chars)</label>
        <div class="input-wrapper">
          <input type="text" id="password-box" class="ios-box valid" readonly>
          <button class="box-copy-btn" onclick="copyValue('password-box', this)" title="Copy">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>
      </div>
      <button class="btn-proceed" onclick="proceedStep(3)">
        <span>Proceed</span>
      </button>
    </div>

    <!-- STEP 3: Recovery Email -->
    <div class="step-card" id="step-3">
      <div class="info-box-group">
        <label class="box-label">Recovery Email</label>
        <div class="input-wrapper">
          <input type="text" id="recovery-box" class="ios-box valid" readonly>
          <button class="box-copy-btn" onclick="copyValue('recovery-box', this)" title="Copy">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>
      </div>
      <button class="btn-proceed" onclick="resetAll()">
        <span>Complete / Reset</span>
      </button>
    </div>

  </div>

  <script>
    const copyIconSVG = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
    const copiedCheckSVG = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
    let toastTimer;

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 2000);
    }

    function copyValue(elementId, btnElement) {
      const val = document.getElementById(elementId).value;
      if (!val) return;
      navigator.clipboard.writeText(val).then(() => {
        btnElement.classList.add('copied');
        btnElement.innerHTML = copiedCheckSVG;
        showToast();
        setTimeout(() => {
          btnElement.classList.remove('copied');
          btnElement.innerHTML = copyIconSVG;
        }, 2000);
      });
    }

    function initGenerator() {
      let chars = "abcdefghijklmnopqrstuvwxyz";
      let nums = "0123456789";

      // 1. Generate Username / Email
      let uLength = Math.floor(Math.random() * 3) + 8;
      let nLength = Math.floor(Math.random() * 3) + 2;
      let username = "";
      let randomChar = chars.charAt(Math.floor(Math.random() * chars.length));
      username += randomChar;

      for (let i = 0; i < uLength - 1; i++) {
        username += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      for (let j = 0; j < nLength; j++) {
        username += nums.charAt(Math.floor(Math.random() * nums.length));
      }
      let email = username + "@gmail.com";

      // 2. Generate Password (10 to 12 chars)
      let passStartUpper = randomChar.toUpperCase();
      let password = passStartUpper;
      let blocksCount = Math.random() < 0.5 ? 2 : 3; 
      for (let b = 0; b < blocksCount; b++) {
        password += chars.charAt(Math.floor(Math.random() * chars.length));
        password += chars.charAt(Math.floor(Math.random() * chars.length));
        password += nums.charAt(Math.floor(Math.random() * nums.length));
      }
      password += chars.charAt(Math.floor(Math.random() * chars.length));
      if (password.length < 10) password += chars.charAt(Math.floor(Math.random() * chars.length));
      else if (password.length > 12) password = password.substring(0, 12);

      // 3. Generate Recovery Email
      let recoveryEmail = username + "sec" + Math.floor(Math.random() * 90 + 10) + "@gmail.com";

      // Set values
      document.getElementById('email-box').value = email;
      document.getElementById('password-box').value = password;
      document.getElementById('recovery-box').value = recoveryEmail;
    }

    function proceedStep(stepNumber) {
      document.querySelectorAll('.step-card').forEach(card => card.classList.remove('active'));
      document.getElementById('step-' + stepNumber).classList.add('active');
    }

    function resetAll() {
      initGenerator();
      proceedStep(1);
    }
  </script>
</body>
</html>
