<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Account Setup Wizard - iOS Style</title>
  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --accent-blue: #007aff;
      --accent-green: #34c759;
      --accent-red: #ff3b30;
      --text-main: #000000;
      --text-muted: #8e8e93;
      --border-color: #c6c6c8;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
      opacity: 0;
      z-index: 9999;
    }

    #toast.show {
      top: 14px;
      opacity: 1;
    }

    #toast .toast-icon {
      background: var(--accent-green);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Top Title */
    .header-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: -0.4px;
    }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Step Cards */
    .step-card {
      display: none;
      flex-direction: column;
      gap: 16px;
      background: var(--card-bg);
      padding: 24px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    .step-card.active {
      display: flex;
    }

    .info-box-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .box-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.3px;
      padding-left: 4px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    /* iOS Box Styles */
    .ios-box {
      width: 100%;
      padding: 12px 44px 12px 14px;
      background: var(--card-bg);
      border-radius: 10px;
      font-size: 14.5px;
      font-family: monospace, var(--font-family);
      color: var(--text-main);
      outline: none;
      transition: all 0.3s ease;
      user-select: text;
      -webkit-user-select: text;
      border: 1.5px solid var(--border-color);
    }

    /* Dynamic Border & Glow States */
    .ios-box.valid {
      border: 1.5px solid var(--accent-green);
      box-shadow: 0 0 10px rgba(52, 199, 89, 0.25), 0 2px 6px rgba(52, 199, 89, 0.15);
    }

    .ios-box.invalid {
      border: 1.5px solid var(--accent-red);
      box-shadow: 0 0 10px rgba(255, 59, 48, 0.25), 0 2px 6px rgba(255, 59, 48, 0.15);
    }

    /* Status text below input */
    .status-msg {
      font-size: 12px;
      font-weight: 500;
      padding-left: 4px;
      display: none;
    }
    .status-msg.error {
      color: var(--accent-red);
      display: block;
    }
    .status-msg.success {
      color: var(--accent-green);
      display: block;
    }

    /* Right side indicator/icon inside input box */
    .box-indicator {
      position: absolute;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* Copy Button inside Box */
    .box-copy-btn {
      position: absolute;
      right: 8px;
      width: 26px;
      height: 26px;
      background: #f0f0f5;
      color: var(--accent-blue);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      transition: background 0.2s ease, color 0.2s ease;
      pointer-events: auto;
    }

    .box-copy-btn.copied {
      background: var(--accent-green) !important;
      color: #ffffff !important;
    }

    /* Proceed / Action Button */
    .btn-proceed {
      width: 100%;
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
      transition: opacity 0.2s ease;
    }

    .btn-proceed:active {
      opacity: 0.8;
    }

    .btn-success {
      background: var(--accent-green);
      box-shadow: 0 4px 12px rgba(52, 199, 89, 0.25);
    }
  </style>
</head>
<body onload="initWizard()">

  <!-- Toast Notification -->
  <div id="toast">
    <div class="toast-icon">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <span>Copied Successfully!</span>
  </div>

  <h1 class="header-title" id="page-heading">Your Email Address</h1>

  <div class="container">
    
    <!-- STEP 1: Email Input -->
    <div class="step-card active" id="step-1">
      <div class="info-box-group">
        <label class="box-label">Email Address</label>
        <div class="input-wrapper">
          <input type="text" id="email-box" class="ios-box" placeholder="Enter your email address" oninput="checkEmailInput()">
          <div class="box-indicator" id="email-indicator"></div>
        </div>
        <span id="email-status" class="status-msg"></span>
      </div>
      <button class="btn-proceed" onclick="proceedToPassword()">
        <span>Proceed</span>
      </button>
    </div>

    <!-- STEP 2: Password Setup -->
    <div class="step-card" id="step-2">
      <div class="info-box-group">
        <label class="box-label">Password (10-12 Chars)</label>
        <div class="input-wrapper">
          <input type="text" id="password-box" class="ios-box valid" readonly>
          <button class="box-copy-btn" onclick="copyValue('password-box', this)" title="Copy">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>
      </div>
      <button class="btn-proceed" onclick="proceedToNext(3, 'Recovery Email')">
        <span>Proceed</span>
      </button>
    </div>

    <!-- STEP 3: Recovery Email -->
    <div class="step-card" id="step-3">
      <div class="info-box-group">
        <label class="box-label">Recovery Email</label>
        <div class="input-wrapper">
          <input type="text" id="recovery-box" class="ios-box valid" readonly>
          <button class="box-copy-btn" onclick="copyValue('recovery-box', this)" title="Copy">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>
      </div>
      <button class="btn-proceed" onclick="proceedToNext(4, '2FA Verification Code')">
        <span>Proceed</span>
      </button>
    </div>

    <!-- STEP 4: 2FA Code -->
    <div class="step-card" id="step-4">
      <div class="info-box-group">
        <label class="box-label">2FA Secret Key</label>
        <div class="input-wrapper">
          <input type="text" id="tfa-box" class="ios-box valid" readonly>
          <button class="box-copy-btn" onclick="copyValue('tfa-box', this)" title="Copy">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>
      </div>
      <button class="btn-proceed" onclick="proceedToConfirm()">
        <span>Review & Confirm</span>
      </button>
    </div>

    <!-- STEP 5: Confirm & Save Summary Page -->
    <div class="step-card" id="step-5">
      <div class="info-box-group">
        <label class="box-label">Email Address</label>
        <div class="input-wrapper">
          <input type="text" id="sum-email" class="ios-box valid" readonly>
          <button class="box-copy-btn" onclick="copyValue('sum-email', this)" title="Copy"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
        </div>
      </div>

      <div class="info-box-group">
        <label class="box-label">Password</label>
        <div class="input-wrapper">
          <input type="text" id="sum-password" class="ios-box valid" readonly>
          <button class="box-copy-btn" onclick="copyValue('sum-password', this)" title="Copy"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
        </div>
      </div>

      <div class="info-box-group">
        <label class="box-label">Recovery Email</label>
        <div class="input-wrapper">
          <input type="text" id="sum-recovery" class="ios-box valid" readonly>
          <button class="box-copy-btn" onclick="copyValue('sum-recovery', this)" title="Copy"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
        </div>
      </div>

      <div class="info-box-group">
        <label class="box-label">2FA Code</label>
        <div class="input-wrapper">
          <input type="text" id="sum-tfa" class="ios-box valid" readonly>
          <button class="box-copy-btn" onclick="copyValue('sum-tfa', this)" title="Copy"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
        </div>
      </div>

      <button class="btn-proceed btn-success" onclick="saveAccount()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span>Save Account</span>
      </button>
    </div>

  </div>

  <script>
    const copyIconSVG = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
    const copiedCheckSVG = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
    let toastTimer;

    // Simulated existing database emails
    const submittedEmails = ["sohan123@gmail.com", "testaccount@gmail.com", "admin99@gmail.com"];

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 2000);
    }

    function copyValue(elementId, btnElement) {
      const val = document.getElementById(elementId).value;
      if (!val) return;
      navigator.clipboard.writeText(val).then(() => {
        btnElement.classList.add('copied');
        btnElement.innerHTML = copiedCheckSVG;
        showToast();
        setTimeout(() => {
          btnElement.classList.remove('copied');
          btnElement.innerHTML = copyIconSVG;
        }, 2000);
      });
    }

    function initWizard() {
      // Check URL parameters for pre-filled email
      const urlParams = new URLSearchParams(window.location.search);
      const paramEmail = urlParams.get('email');
      if (paramEmail) {
        document.getElementById('email-box').value = paramEmail;
      }
      checkEmailInput();

      // Generate random password, recovery & 2FA
      let chars = "abcdefghijklmnopqrstuvwxyz";
      let nums = "0123456789";
      let password = "A" + chars[Math.floor(Math.random()*chars.length)] + Math.floor(10000000 + Math.random()*90000000) + "9";
      document.getElementById('password-box').value = password;
      document.getElementById('recovery-box').value = "sec" + Math.floor(10000 + Math.random()*90000) + "@gmail.com";
      document.getElementById('tfa-box').value = "JBSWY3DPEHPK3PXP";
    }

    function checkEmailInput() {
      const emailBox = document.getElementById('email-box');
      const statusMsg = document.getElementById('email-status');
      const indicator = document.getElementById('email-indicator');
      const val = emailBox.value.trim().toLowerCase();

      emailBox.classList.remove('valid', 'invalid');
      statusMsg.className = "status-msg";
      statusMsg.textContent = "";
      indicator.innerHTML = "";

      if (!val) return;

      // Check if already submitted
      if (submittedEmails.includes(val)) {
        emailBox.classList.add('invalid');
        statusMsg.textContent = "Email already submitted";
        statusMsg.classList.add('error');
        // Info / 'i' icon for already submitted
        indicator.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;
        return;
      }

      // Check email format (must contain @)
      if (val.includes('@') && val.includes('.')) {
        emailBox.classList.add('valid');
        statusMsg.textContent = "Email is available";
        statusMsg.classList.add('success');
        // Green tick checkmark icon
        indicator.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34c759" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
      } else {
        emailBox.classList.add('invalid');
        // No cross icon as requested, only red shadow / border
        indicator.innerHTML = "";
      }
    }

    function switchStep(stepIndex, titleText) {
      document.querySelectorAll('.step-card').forEach(card => card.classList.remove('active'));
      document.getElementById('step-' + stepIndex).classList.add('active');
      document.getElementById('page-heading').textContent = titleText;
    }

    function proceedToPassword() {
      const emailBox = document.getElementById('email-box');
      if (emailBox.classList.contains('invalid') || !emailBox.value.trim()) {
        alert("Please provide a valid email address.");
        return;
      }
      switchStep(2, "Create Password");
    }

    function proceedToNext(nextStep, title) {
      let titles = {3: "Recovery Email", 4: "2FA Verification Code"};
      switchStep(nextStep, titles[nextStep]);
    }

    function proceedToConfirm() {
      // Pass values to confirmation summary fields
      document.getElementById('sum-email').value = document.getElementById('email-box').value;
      document.getElementById('sum-password').value = document.getElementById('password-box').value;
      document.getElementById('sum-recovery').value = document.getElementById('recovery-box').value;
      document.getElementById('sum-tfa').value = document.getElementById('tfa-box').value;

      switchStep(5, "Confirm & Save Account");
    }

    function saveAccount() {
      alert("Account saved successfully!");
      window.location.reload();
    }
  </script>
</body>
</html>
